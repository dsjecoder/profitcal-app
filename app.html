      const formatVND = (num) => {
        if (num === null || num === undefined || isNaN(num)) return '0đ';
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num);
      };

      // Play Beep Sound
      const playBeepSound = () => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const play = (freq, start, duration) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + start);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + start);
            osc.stop(ctx.currentTime + start + duration);
          };
          play(880, 0, 0.15);
          play(1100, 0.2, 0.25);
        } catch (e) {}
      };

        { id: 'SP-102', orderId: '240801SP002', orderDate: '2026-08-01', platform: 'shopee', sku: 'QUAN-JEAN-BLU-30', productName: 'Quần Jean Slimfit Co Giãn (Xanh 30)', quantity: 1, grossRevenue: 450000, netSettlement: 395000, fixedFee: 27000, paymentFee: 18000, serviceFee: 10000, marketingFee: 65000, otherFee: 0, totalFees: 120000, cogs: 210000, packagingCost: 3000, taxAmount: 6750, orderStatus: 'completed', feeRatio: 26.6, netProfit: 175250, isHighFee: true, isRefundAnomaly: false, isNegativeProfit: false, anomalyReason: 'Phí Marketing Ads cao (65.000đ)', receiverName: 'Trần Thị Bình', receiverPhone: '0912345678', receiverAddress: '45 Nguyễn Huệ', province: 'Hồ Chí Minh', district: 'Quận 1' },
        { id: 'SP-103', orderId: '240802SP003', orderDate: '2026-08-02', platform: 'shopee', sku: 'VAY-HOA-NHI-S', productName: 'Váy Hoa Nhí Vintage (Size S)', quantity: 1, grossRevenue: 290000, netSettlement: -35000, fixedFee: 0, paymentFee: 0, serviceFee: 0, marketingFee: 0, otherFee: 35000, totalFees: 35000, cogs: 120000, packagingCost: 3000, taxAmount: 4350, orderStatus: 'returned', feeRatio: 12.0, netProfit: -162350, isHighFee: false, isRefundAnomaly: true, isNegativeProfit: true, anomalyReason: 'Đơn hoàn hủy bị âm ví (-35.000đ) & mất vốn', receiverName: 'Lê Hoàng Cường', receiverPhone: '0977889900', receiverAddress: '78 Trần Phú', province: 'Đà Nẵng', district: 'Hải Châu' },

        // Compute Summaries

        orders.forEach(o => {
          const tax = Math.round((o.grossRevenue || 0) * 0.015);
          grossRevenue += o.grossRevenue;
          netSettlement += o.netSettlement;
          totalFees += o.totalFees;
          totalCOGS += o.cogs;
          totalTaxAmount += tax;
        });

        const totalOrders = orders.length;
        const totalPackaging = totalOrders * packagingCost;
        const netProfit = netSettlement - totalCOGS - totalPackaging - totalTaxAmount;
        const avgFeeRatio = grossRevenue > 0 ? (totalFees / grossRevenue) * 100 : 0;
        const profitMargin = grossRevenue > 0 ? (netProfit / grossRevenue) * 100 : 0;

        const loadDemo = (p) => {
          setPlatform(p);
          setOrders(MOCK_SHOPEE);
          if (window.confetti) window.confetti({ particleCount: 70, spread: 60 });

                      <button onClick={() => setPaymentMethod('bank')} className={`p-2 rounded-xl border text-center font-bold ${paymentMethod === 'bank' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'bg-navy-950 border-navy-800'}`}>Chuyển Khoản</button>
                      <button onClick={() => setPaymentMethod('binance')} className={`p-2 rounded-xl border text-center font-bold ${paymentMethod === 'binance' ? 'bg-amber-500/20 border-amber-500 text-amber-400' : 'bg-navy-950 border-navy-800'}`}>Binance Pay</button>
                      <button onClick={() => setPaymentMethod('oxapay')} className={`p-2 rounded-xl border text-center font-bold ${paymentMethod === 'oxapay' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'bg-navy-950 border-navy-800'}`}>OxaPay Crypto</button>
                    </div>
                  </div>

                  <button onClick={() => { setIsPro(true); setShowPricingModal(false); alert('Đã kích hoạt gói PRO thành công!'); }} className="w-full py-3.5 bg-amber-500 text-navy-950 font-black text-sm rounded-xl">
                    Xác Nhận Đã Thanh Toán 🚀
                  </button>
                  <button onClick={() => setShowPricingModal(false)} className="text-xs text-slate-400 underline">Bỏ qua</button>
                </div>
              </div>
            )}

            {/* Terms Modal */}
            {showTermsModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/85 backdrop-blur-md">
                <div className="bg-navy-900 border border-navy-700 rounded-3xl p-6 w-full max-w-lg space-y-4">
                  <h3 className="text-lg font-bold text-white">Điều Khoản Sử Dụng & Chính Sách Bảo Mật</h3>
                  <div className="p-3 bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-xs rounded-xl">
                    🔒 <strong>Bảo mật 100% Client-side:</strong> ProfitCal xử lý dữ liệu trực tiếp trên Trình duyệt của bạn. KHÔNG lưu trữ file Excel hay SĐT khách hàng trên Server.
                  </div>
                  <button onClick={() => setShowTermsModal(false)} className="w-full py-2.5 bg-emerald-500 text-navy-950 font-bold text-xs rounded-xl">Đã Hiểu & Đồng Ý</button>
                </div>
              </div>
            )}

            {/* Footer */}
            <footer className="bg-navy-950 border-t border-navy-800 p-6 text-center text-xs text-slate-500">
              <p>© 2026 ProfitCal Tagki • Official Domain: https://profitcal.tagki.com</p>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
