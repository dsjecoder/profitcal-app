<!DOCTYPE html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProfitCal – Ecom Profit, Tax 1.5% & Fee Audit Tool | Official https://profitcal.tagki.com</title>

    <meta property="og:url" content="https://profitcal.tagki.com" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              navy: {
                800: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>

    <!-- React 18 & SheetJS & Confetti CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </head>
  <body class="bg-navy-950 text-slate-100 font-sans selection:bg-emerald-500 selection:text-navy-950 min-h-screen relative">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const formatVND = (num) => {
        if (num === null || num === undefined || isNaN(num)) return '0đ';
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num);
      };

      const DICT = {
        vi: {
          title: 'Kiểm Toán Lợi Nhuận Ròng & Thuế TMĐT',
          upload_h: 'Tải Báo Cáo Đơn Hàng / Đối Soát Excel',
          upload_p: 'Gói FREE: Tối đa 20 đơn / lượt ghép (Reset sau 7 ngày)',
          gross: 'Doanh Thu Hóa Đơn',
          net: 'Thực Nhận Ví Sàn',
          fees: 'Phí Sàn Đã Trừ',
          tax: 'Thuế TMĐT (1.5%)',
          profit: 'LỢI NHUẬN RÒNG THỰC TẾ',
          ship_btn: '🚚 Ghép File Vận Chuyển Excel (Tối đa 20 đơn bản Free)',
          pro_btn: '👑 Gói PRO',
          admin_btn: '🛡️ Admin Portal (/admin)',
          terms_btn: '📄 Điều Khoản',
        },
        en: {
          title: 'Net Profit & E-com Tax Audit',
          upload_h: 'Upload Order Report / Excel Settlement',
          upload_p: 'Free Plan: Max 20 orders / export (7-day reset interval)',
          gross: 'Gross Revenue',
          net: 'Net Settlement Payout',
          fees: 'Total Platform Fees',
          tax: 'E-com Tax (1.5%)',
          profit: 'NET PROFIT (REAL NET INCOME)',
          ship_btn: '🚚 Export Shipping Excel (Max 20 orders Free)',
          pro_btn: '👑 PRO Plan',
          admin_btn: '🛡️ Admin Portal (/admin)',
          terms_btn: '📄 Terms & Policy',
        }
      };

      const MOCK_SHOPEE = [
        { id: 'SP-101', orderId: '240801SP001', orderDate: '2026-08-01', platform: 'shopee', sku: 'AT-COTTON-BLK-L', productName: 'Áo Thun Cotton Oversize (Đen L)', quantity: 2, grossRevenue: 380000, netSettlement: 312000, fixedFee: 22800, paymentFee: 15200, serviceFee: 30000, marketingFee: 45000, otherFee: 0, totalFees: 113000, cogs: 140000, packagingCost: 3000, taxAmount: 5700, orderStatus: 'completed', feeRatio: 29.7, netProfit: 163300, receiverName: 'Nguyễn Văn An', receiverPhone: '0988123456', receiverAddress: '123 Lê Lợi', province: 'Hà Nội', district: 'Cầu Giấy' },
        { id: 'SP-102', orderId: '240801SP002', orderDate: '2026-08-01', platform: 'shopee', sku: 'QUAN-JEAN-BLU-30', productName: 'Quần Jean Slimfit Co Giãn (Xanh 30)', quantity: 1, grossRevenue: 450000, netSettlement: 395000, fixedFee: 27000, paymentFee: 18000, serviceFee: 10000, marketingFee: 65000, otherFee: 0, totalFees: 120000, cogs: 210000, packagingCost: 3000, taxAmount: 6750, orderStatus: 'completed', feeRatio: 26.6, netProfit: 175250, receiverName: 'Trần Thị Bình', receiverPhone: '0912345678', receiverAddress: '45 Nguyễn Huệ', province: 'Hồ Chí Minh', district: 'Quận 1' },
      ];

      function App() {
        const [lang, setLang] = useState('vi');
        const [orders, setOrders] = useState([]);
        const [showPricingModal, setShowPricingModal] = useState(false);
        const [pricingStep, setPricingStep] = useState('plan_select');
        const [selectedPlan, setSelectedPlan] = useState('yearly');
        const [paymentMethod, setPaymentMethod] = useState('vietqr');
        const [showAdminModal, setShowAdminModal] = useState(false);
        const [showTermsModal, setShowTermsModal] = useState(false);
        const [showAuthModal, setShowAuthModal] = useState(false);
        const [showGooglePicker, setShowGooglePicker] = useState(false);
        const [isPro, setIsPro] = useState(false);
        const [userEmail, setUserEmail] = useState('');
        const [userName, setUserName] = useState('');

        // Catch Google OAuth Access Token Callback in app.html
        useEffect(() => {
          try {
            const hash = window.location.hash;
            if (hash && hash.includes('access_token=')) {
              const params = new URLSearchParams(hash.replace(/^#/, ''));
              const token = params.get('access_token');
              if (token) {
                const parts = token.split('.');
                if (parts.length === 3) {
                  const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
                  const email = payload.email || 'ecoder108108108@gmail.com';
                  const name = payload.user_metadata?.full_name || payload.user_metadata?.name || 'Coder108 E';
                  setUserEmail(email);
                  setUserName(name);
                  if (window.confetti) window.confetti({ particleCount: 80, spread: 70 });
                  alert(`🎉 Đã xác thực thành công qua Google OAuth!\n\nEmail: ${email}\nHọ tên: ${name}`);
                }
              }
              window.history.replaceState(null, '', window.location.pathname + window.location.search);
            }
          } catch (e) {}
        }, []);

        const t = DICT[lang] || DICT['vi'];

        let grossRevenue = 0, netSettlement = 0, totalFees = 0, totalCOGS = 0, totalTaxAmount = 0;
        orders.forEach(o => {
          const tax = Math.round((o.grossRevenue || 0) * 0.015);
          grossRevenue += o.grossRevenue;
          netSettlement += o.netSettlement;
          totalFees += o.totalFees;
          totalCOGS += o.cogs;
          totalTaxAmount += tax;
        });

        const netProfit = netSettlement - totalCOGS - (orders.length * 3000) - totalTaxAmount;

        const loadDemo = () => {
          setOrders(MOCK_SHOPEE);
          if (window.confetti) window.confetti({ particleCount: 70, spread: 60 });
        };

        const priceLabel = selectedPlan === 'yearly' ? '599.000đ / Năm' : '130.000đ / Tháng';

        return (
          <div className="min-h-screen flex flex-col relative">
            
            {/* Mobile Notice Banner */}
            <div className="bg-amber-950 border-b border-amber-500/30 px-4 py-2 text-xs flex items-center justify-between">
              <span className="text-amber-300">📱 <strong>Mobile UI/UX Notice:</strong> Trên Điện thoại, hệ thống tối ưu xử lý tối đa <strong>20 đơn/lần</strong> để máy chạy mượt.</span>
            </div>

            {/* Header */}
            <header className="bg-navy-900 border-b border-navy-800 h-20 px-6 flex items-center justify-between sticky top-0 z-40">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 font-black text-xl">⚡</div>
                <div>
                  <h1 className="text-xl font-extrabold text-white">ProfitCal</h1>
                  <p className="text-xs text-slate-400 font-mono">https://profitcal.tagki.com</p>
                </div>
              </div>

              <div className="flex items-center space-x-2 text-xs">
                {/* i18n Switcher */}
                <div className="bg-navy-950 p-1 rounded-xl border border-navy-800 flex gap-1">
                  <button onClick={() => setLang('vi')} className={`px-2.5 py-1 rounded font-bold transition-all ${lang === 'vi' ? 'bg-emerald-500 text-navy-950 shadow' : 'text-slate-400'}`}>🇻🇳 VN</button>
                  <button onClick={() => setLang('en')} className={`px-2.5 py-1 rounded font-bold transition-all ${lang === 'en' ? 'bg-emerald-500 text-navy-950 shadow' : 'text-slate-400'}`}>🇬🇧 EN</button>
                </div>

                <button onClick={() => setShowAuthModal(true)} className="px-3 py-1.5 rounded-xl bg-navy-950 border border-navy-700 text-slate-200 font-semibold">🔑 Đăng Nhập</button>
                <button onClick={() => { setPricingStep('plan_select'); setShowPricingModal(true); }} className="px-3.5 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 font-bold hover:bg-amber-500/20">{t.pro_btn}</button>
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">
              
              {/* File Upload Box */}
              <div className="bg-navy-900 border border-navy-800 rounded-3xl p-8 text-center space-y-4 shadow-2xl">
                <h2 className="text-2xl font-black text-white">{t.upload_h}</h2>
                <p className="text-xs text-slate-400">{t.upload_p}</p>
                <div className="pt-2 flex items-center justify-center gap-3">
                  <button onClick={loadDemo} className="px-5 py-2.5 bg-emerald-500 text-navy-950 font-bold text-xs rounded-xl shadow-lg">🧪 Nạp Data Mẫu Shopee / TikTok</button>
                </div>
              </div>

              {/* Financial Dashboard */}
              {orders.length > 0 && (
                <div className="space-y-8 animate-fade-in">
                  <div className="flex flex-wrap items-center justify-between bg-navy-900 border border-navy-800 p-6 rounded-3xl gap-4">
                    <h2 className="text-xl font-bold text-white">{t.title}</h2>
                    <button className="px-4 py-2.5 bg-cyan-500/20 border border-cyan-500/40 text-cyan-300 font-bold text-xs rounded-xl">{t.ship_btn}</button>
                  </div>

                  {/* KPI Cards */}
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div className="bg-navy-900 border border-navy-800 p-5 rounded-3xl"><span className="text-xs font-bold text-slate-400">{t.gross}</span><div className="text-xl font-black font-mono text-white mt-2">{formatVND(grossRevenue)}</div></div>
                    <div className="bg-navy-900 border border-navy-800 p-5 rounded-3xl"><span className="text-xs font-bold text-slate-400">{t.net}</span><div className="text-xl font-black font-mono text-indigo-300 mt-2">{formatVND(netSettlement)}</div></div>
                    <div className="bg-navy-900 border border-navy-800 p-5 rounded-3xl"><span className="text-xs font-bold text-rose-400">{t.fees}</span><div className="text-xl font-black font-mono text-rose-400 mt-2">{formatVND(totalFees)}</div></div>
                    <div className="bg-navy-900 border border-navy-800 p-5 rounded-3xl"><span className="text-xs font-bold text-purple-400">{t.tax}</span><div className="text-xl font-black font-mono text-purple-300 mt-2">{formatVND(totalTaxAmount)}</div></div>
                    <div className="p-5 rounded-3xl border bg-emerald-950/60 border-emerald-500/40 md:col-span-2"><span className="text-xs font-black text-emerald-400">{t.profit}</span><div className="text-2xl font-black font-mono text-emerald-400 mt-1">{formatVND(netProfit)}</div></div>
                  </div>
                </div>
              )}

            </main>

            {/* Auth Modal with Inline Google Account Selector */}
            {showAuthModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                <div className="bg-white text-slate-900 rounded-3xl p-8 w-full max-w-md space-y-6 text-center shadow-2xl relative border border-slate-100">
                  <button onClick={() => { setShowAuthModal(false); setShowGooglePicker(false); }} className="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-600 rounded-xl bg-slate-100">✕</button>

                  {showGooglePicker ? (
                    <div className="space-y-4 text-left">
                      <div className="border-b border-slate-100 pb-3">
                        <h3 className="text-base font-bold text-slate-900">Sign in with Google</h3>
                        <p className="text-xs text-slate-500">Chọn một tài khoản để tiếp tục tới <strong>profitcal.tagki.com</strong></p>
                      </div>
                      <div className="space-y-2">
                        <button onClick={() => { setShowAuthModal(false); setShowGooglePicker(false); alert('Đã đăng nhập thành công bằng ecodervn@gmail.com!'); }} className="w-full p-3 rounded-2xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50 flex items-center gap-3 text-xs transition-all text-left">
                          <div className="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center">E</div>
                          <div><div className="font-bold text-slate-800 text-sm">Ecodervn Alan Vu</div><div className="text-slate-500 font-mono">ecodervn@gmail.com</div></div>
                        </button>
                        <button onClick={() => { setShowAuthModal(false); setShowGooglePicker(false); alert('Đã đăng nhập thành công bằng dsjecoder@gmail.com!'); }} className="w-full p-3 rounded-2xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50 flex items-center gap-3 text-xs transition-all text-left">
                          <div className="w-8 h-8 rounded-full bg-teal-600 text-white font-bold flex items-center justify-center">D</div>
                          <div><div className="font-bold text-slate-800 text-sm">Dsj Ecoder Vu</div><div className="text-slate-500 font-mono">dsjecoder@gmail.com</div></div>
                        </button>
                        <button onClick={() => { const email = prompt('Nhập Gmail của bạn:'); if (email) { setShowAuthModal(false); setShowGooglePicker(false); alert(`Đã đăng nhập thành công bằng ${email}!`); } }} className="w-full p-3 rounded-2xl border border-dashed border-slate-300 hover:bg-slate-50 flex items-center gap-2 text-xs text-blue-600 font-bold">
                          <span>+ Sử dụng một tài khoản Google khác...</span>
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-6">
                      <div className="w-16 h-16 rounded-2xl bg-blue-600 text-white font-black text-3xl mx-auto flex items-center justify-center shadow-lg">T</div>
                      <div>
                        <h2 className="text-2xl font-extrabold text-slate-900">Đăng nhập</h2>
                        <p className="text-xs text-slate-500">Khám phá hệ sinh thái tài khoản số & dịch vụ Tagki</p>
                      </div>
                      <button onClick={() => setShowGooglePicker(true)} className="w-full py-3 px-4 rounded-2xl bg-white border border-slate-300 text-slate-700 font-bold text-xs shadow-sm flex items-center justify-center gap-2 hover:bg-slate-50 transition-all">
                        <span>G Đăng nhập bằng Google (Gmail)</span>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Pricing Modal: 3 Columns Selection & Tagki.com Checkout */}
            {showPricingModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/90 backdrop-blur-md">
                <div className="bg-navy-900 border border-amber-500/40 rounded-3xl p-6 w-full max-w-3xl space-y-6">
                  <div className="flex justify-between items-center border-b border-navy-800 pb-2">
                    <h3 className="text-xl font-extrabold text-white">Chọn Gói Dịch Vụ ProfitCal</h3>
                    <button onClick={() => setShowPricingModal(false)} className="text-slate-400">✕</button>
                  </div>

                  {pricingStep === 'plan_select' ? (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                      <div className="p-4 bg-navy-950 rounded-2xl border border-navy-800 space-y-3">
                        <span className="font-bold text-slate-400">Gói FREE</span>
                        <div className="text-2xl font-black text-white">0 VNĐ</div>
                        <p className="text-slate-400">20 đơn/lượt ghép (Reset 7 ngày)</p>
                        <button disabled className="w-full py-2 bg-navy-900 text-slate-500 font-bold rounded-xl">Đang Sử Dụng</button>
                      </div>

                      <div className="p-4 bg-navy-950 rounded-2xl border border-amber-500/40 space-y-3">
                        <span className="font-bold text-amber-400">PRO Tháng</span>
                        <div className="text-2xl font-black text-amber-400">130.000đ</div>
                        <p className="text-slate-300">Xuất file vận chuyển không giới hạn</p>
                        <button onClick={() => { setSelectedPlan('monthly'); setPricingStep('checkout'); }} className="w-full py-2 bg-amber-500 text-navy-950 font-bold rounded-xl">Chọn Gói Tháng 🚀</button>
                      </div>

                      <div className="p-4 bg-navy-950 rounded-2xl border-2 border-amber-500 space-y-3">
                        <span className="font-bold text-amber-300">PRO Tiết Kiệm Năm (-62%)</span>
                        <div className="text-2xl font-black text-amber-300">599.000đ</div>
                        <p className="text-emerald-400 font-bold">Chỉ ~49k / tháng</p>
                        <button onClick={() => { setSelectedPlan('yearly'); setPricingStep('checkout'); }} className="w-full py-2 bg-amber-500 text-navy-950 font-black rounded-xl">Chọn Gói Năm (Khuyên Dùng) 🚀</button>
                      </div>
                    </div>
                  ) : (
                    /* Checkout 100% tagki.com style */
                    <div className="space-y-4 text-xs text-center">
                      <div className="p-3 bg-navy-950 border border-navy-800 rounded-xl flex items-center justify-between text-slate-300">
                        <span>⏱️ Thời gian đếm ngược: <strong className="text-amber-400">14:59</strong></span>
                        <span className="text-emerald-400 font-bold animate-pulse">🔄 Đang kiểm tra giao dịch tự động...</span>
                      </div>

                      <div className="bg-white p-3 rounded-2xl w-44 h-44 mx-auto shadow-xl">
                        <img src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=STK_0988888999_PROFITCAL`} alt="VietQR" className="w-36 h-36 mx-auto" />
                      </div>
                      <div className="p-3 bg-navy-950 border border-navy-800 rounded-xl text-left font-mono space-y-1">
                        <div>STK: <strong className="text-amber-400">0988 888 999</strong> (MBBank)</div>
                        <div>Số tiền: <strong className="text-emerald-400">{priceLabel}</strong></div>
                        <div>Nội dung CK: <strong className="text-cyan-300">PROFITCAL PRO DEMO</strong></div>
                      </div>
                      <button onClick={() => { setIsPro(true); setShowPricingModal(false); alert('Đã kích hoạt PRO thành công!'); }} className="w-full py-3 bg-amber-500 text-navy-950 font-black rounded-xl">Xác Nhận Đã Thanh Toán 🚀</button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Footer */}
            <footer className="bg-navy-950 border-t border-navy-800 p-6 text-center text-xs text-slate-500">
              <p>© 2026 ProfitCal Tagki • Official Domain: https://profitcal.tagki.com</p>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
